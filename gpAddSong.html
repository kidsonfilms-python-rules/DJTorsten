    <input type="url" name="addSong" id="addSong" placeholder="Paste Link Here...">
    <ul id="songList">
        <!-- <div class="song"><i class="fas fa-times-circle"></i> blah</div>
        <div class="song">blah</div>
        <div class="song">blah</div> -->

    <button id="done">ADD</button>
