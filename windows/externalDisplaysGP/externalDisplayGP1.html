<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.15.0/css/all.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
    <title>External Display</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            /* font-family: 'Open Sans'; */
            font-family: 'Poppins', sans-serif;
            -webkit-touch-callout: none;
            /* iOS Safari */
            -webkit-user-select: none;
            /* Safari */
            -khtml-user-select: none;
            /* Konqueror HTML */
            -moz-user-select: none;
            /* Old versions of Firefox */
            -ms-user-select: none;
            /* Internet Explorer/Edge */
            user-select: none;
        }

        .nowPlaying {
            width: 40vw;
            /* Can be in percentage also. */
            height: auto;
            margin: 30vh auto;
            padding: 10px;
            position: relative;
            /* background-color: darkgreen; */
            text-align: center;
        }

        html,
        body {
            overflow: hidden;
        }

        .song:last-child:not(:nth-child(2)) {
            background: -webkit-linear-gradient(rgb(105, 105, 105), rgba(39, 39, 39, 0));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        body {
            background: linear-gradient(174deg, #00d3fe, #000000, #ee00ff);
            background-size: 600% 600%;

            -webkit-animation: AnimationName 32s ease infinite;
            -moz-animation: AnimationName 32s ease infinite;
            animation: AnimationName 32s ease infinite;
            color: white;
        }

        @-webkit-keyframes AnimationName {
            0% {
                background-position: 0% 64%
            }

            50% {
                background-position: 100% 37%
            }

            100% {
                background-position: 0% 64%
            }
        }

        @-moz-keyframes AnimationName {
            0% {
                background-position: 0% 64%
            }

            50% {
                background-position: 100% 37%
            }

            100% {
                background-position: 0% 64%
            }
        }

        @keyframes AnimationName {
            0% {
                background-position: 0% 64%
            }

            50% {
                background-position: 100% 37%
            }

            100% {
                background-position: 0% 64%
            }
        }

        .nowPlaying h3,
        h2 {
            margin: 5px;
            font-family: 'Open Sans'
        }

        .nowPlaying h1 {
            margin-bottom: 5px;
        }

        img {
            border: 1px solid #ddd;
            /* Gray border */
            border-radius: 4px;
            /* Rounded border */
            padding: 5px;
            /* Some padding */
            width: 20vw;
            /* Set a small width */
        }

        .fa-heart {
            color: red;
        }

        h3,
        h2 {
            font-weight: 500;
        }

        .queue {
            position: absolute;
            top: 5vh;
            left: 2.5vw;
            /* background-color: antiquewhite; */
            max-height: 37vh;
            overflow: hidden;
            font-family: 'Open Sans'
        }

        .song {
            margin-top: 1.5vh;
            margin-bottom: 0vh;
        }

        .song h6 {
            margin: 0;
            color: darkgrey;
        }

        .song p {
            margin-top: 0px;
            margin-bottom: 1px;
            font-size: 19px;
            color: rgb(105, 105, 105);
        }

        .queue h3+div p {
            color: white;
            font-size: 20px;
            font-family: 'Poppins'
        }

        .queue h3+div h6 {
            color: rgb(224, 224, 224);
        }

        .queue h3+div {
            margin-bottom: 1vh;
        }

        /* .song:first-child:nth-last-child(4) ~ .song:last-child  {
            background: -webkit-linear-gradient(rgb(105, 105, 105), rgba(39, 39, 39, 0));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        } */

        .joinParty {
            position: absolute;
            bottom: 0;
            /* background-color: brown; */
            width: 100%;
            text-align: center;
            font-size: 18px;
            text-transform: uppercase;
            font-weight: bold;
            font-family: 'Poppins', sans-serif;
            letter-spacing: 0.5vw;
            font-size: medium;
        }


        .fadeout .fadeline {
            height: 16px;
            background: linear-gradient(174deg, #00d3fe, #000000, #ee00ff);
            -webkit-animation: AnimationName 32s ease infinite;
            -moz-animation: AnimationName 32s ease infinite;
            animation: AnimationName 32s ease infinite;
        }

        .queue h6 {
            color: gray;
            font-weight: 600;
            font-size: 15px;
            margin: 0;
        }

        .clock {
            position: absolute;
            top: 6vh;
            right: 6vw;
        }

        div.time {
            font-size: 30px;
            position: relative;
            color: grey;
            letter-spacing: 2px;
            text-align: left;
        }

        .ampmspan {
           font-size: 10px;
        }

        div.line {
            line-height: 1;
            position: absolute;
            left: 50%;
            top: 50%;
            -webkit-transform: translate(-50%, -50%);
            transform: translate(-50%, -50%);
        }
    </style>
</head>

<body>
    <div class="nowPlaying">
        <img src="" alt="" id="thumbnail">
        <h1 id="npTitle"></h1>
        <h2 id="npAuthor">
            </h4>
            <h3 id="npRequester">
                </h4>
                <h3><i class="fas fa-heart"></i> <span style="font-weight: 300;" id="likes"></span></h6>
    </div>
    <div class="queue" id="queue">
        <h3 style="font-weight: 1000;">Queue</h3>
        <h6><i>No Songs In Queue</i></h6>
        <!-- <div class="song">
            <p>Never Gonna Give You Up</p>
            <h6>Rick Astley | Requested by DJ</h6>
        </div>
        <div class="song">
            <p>Never Gonna Give You Up</p>
            <h6>Rick Astley | Requested by DJ</h6>
        </div>
        <div class="song">
            <p>Never Gonna Give You Up</p>
            <h6>Rick Astley | Requested by DJ</h6>
        </div>
        <div class="song">
            <p>Never Gonna Give You Up</p>
            <h6>Rick Astley | Requested by DJ</h6>
        </div> -->
    </div>

    <div class="joinParty">
        <h2>Request a Song from the DJFlame App <br>Party Code <b>053467</b></h2>
    </div>

    <div class="clock">
        <div class="line">
            <div class="time">
                <span id="date">ERROR</span>
                <span id="time">ERROR</span>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"
        integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
    <script>
        const electron = require('electron')
        const remote = electron.remote;
        const ipcRenderer = electron.ipcRenderer;
        const thisWindow = remote.getCurrentWindow()


        ipcRenderer.on('newExternalDisplayData', (e, d) => {
            console.log("New Data: \n", d)

            var npImg = document.getElementById('thumbnail')
            var npAuthor = document.getElementById('npAuthor')
            var npRequester = document.getElementById('npRequester')
            var npTitle = document.getElementById('npTitle')
            var npLikes = document.getElementById('likes')

            npImg.src = d.nowPlaying.thumbnail
            npAuthor.innerText = d.nowPlaying.author
            npRequester.innerText = `Requested by ${d.nowPlaying.requester}`
            npTitle.innerText = d.nowPlaying.title
            npLikes.innerText = d.nowPlaying.likes

            var queueDiv = document.getElementById('queue')
            queueDiv.innerHTML = "";

            var queueTitle = document.createElement('h3')
            queueTitle.style.fontWeight = '1000'
            queueTitle.innerText = 'Queue'
            queueDiv.appendChild(queueTitle)

            if (d.queue.length == 0) {
                var noSH6 = document.createElement('h6')
                var noSI = document.createElement('i')
                noSI.innerText = 'No Songs In Queue'
                noSH6.appendChild(noSI)
                queueDiv.appendChild(noSH6)
            }

            d.queue.forEach((data) => {
                var songDiv = document.createElement('div')
                songDiv.className = 'song'

                var songTitle = document.createElement('p')
                songTitle.innerText = data.title

                var songSubheading = document.createElement('h6')
                songSubheading.innerText = `${data.author} | Requested by ${data.requester}`

                songDiv.appendChild(songTitle)
                songDiv.appendChild(songSubheading)
                queueDiv.appendChild(songDiv)
            })
        })

        function startTime() {
            var today = new Date();
            var h = today.getHours();
            var m = today.getMinutes();
            var s = today.getSeconds();
            var ampm = h >= 12 ? 'PM' : 'AM';
            var ampmspan = document.createElement('span')
            ampmspan.innerHTML = ampm
            ampmspan.className = 'ampmspan'
            h = h % 12;
            h = h ? h : 12; // the hour '0' should be '12'
            m = checkTime(m);
            s = checkTime(s);

            var timedoc = document.getElementById("time")
            timedoc.innerHTML = h + ":" + m;
            timedoc.appendChild(ampmspan)

            var t = setTimeout(startTime, 500);
            n = new Date();
            y = n.getFullYear().toString().substr(-2);
            m = n.getMonth() + 1;
            d = n.getDate();

            document.getElementById("date").innerHTML = m + "•" + d + "•" + y;
        }

        function checkTime(i) {
            if (i < 10) {
                i = "0" + i;
            }
            return i;
        }
        setInterval(() => {
            //empty
        }, 1);
        startTime()

        // ipcRenderer.send('newExternalDisplayDataTest', '')

        const body = document.body
        body.addEventListener('click', () => {
            thisWindow.close()
        })

    </script>
</body>

</html>
