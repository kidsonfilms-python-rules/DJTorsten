<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJFlame</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .red {
            color: rgb(207, 0, 0);
        }

        h4 {
            font-weight: bold;
        }

        .tipTitle {
            color: #df49a6;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            line-height: 16px;
            margin-bottom: 8px;
        }

        #randomTip {
            color: #c9c9c9;
            font-size: 14px;
            line-height: 20px;
        }

        .tip {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            margin: 0;
            left: 0;
        }

        .tip a {
            color: #c9c9c9;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="center">
            <div class="loader loader--style8" title="7">
                <svg version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg"
                    xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px" width="50%" viewBox="0 0 20 30"
                    style="enable-background:new 0 0 50 50;" xml:space="preserve">
                    <rect x="0" y="10" width="4" height="10" fill="#333" opacity="0.2">
                        <animate attributeName="opacity" attributeType="XML" values="0.2; 1; .2" begin="0s" dur="0.6s"
                            repeatCount="indefinite" />
                        <animate attributeName="height" attributeType="XML" values="10; 20; 10" begin="0s" dur="0.6s"
                            repeatCount="indefinite" />
                        <animate attributeName="y" attributeType="XML" values="10; 5; 10" begin="0s" dur="0.6s"
                            repeatCount="indefinite" />
                    </rect>
                    <rect x="8" y="10" width="4" height="10" fill="#333" opacity="0.2">
                        <animate attributeName="opacity" attributeType="XML" values="0.2; 1; .2" begin="0.15s"
                            dur="0.6s" repeatCount="indefinite" />
                        <animate attributeName="height" attributeType="XML" values="10; 20; 10" begin="0.15s" dur="0.6s"
                            repeatCount="indefinite" />
                        <animate attributeName="y" attributeType="XML" values="10; 5; 10" begin="0.15s" dur="0.6s"
                            repeatCount="indefinite" />
                    </rect>
                    <rect x="16" y="10" width="4" height="10" fill="#333" opacity="0.2">
                        <animate attributeName="opacity" attributeType="XML" values="0.2; 1; .2" begin="0.3s" dur="0.6s"
                            repeatCount="indefinite" />
                        <animate attributeName="height" attributeType="XML" values="10; 20; 10" begin="0.3s" dur="0.6s"
                            repeatCount="indefinite" />
                        <animate attributeName="y" attributeType="XML" values="10; 5; 10" begin="0.3s" dur="0.6s"
                            repeatCount="indefinite" />
                    </rect>
                </svg>
            </div>
            <h4 id="text"></h4>
            <div class="tip">
                <h6 class="tipTitle">Did You Know?</h6>
                <div id="randomTip"></div>
            </div>
        </div>
    </div>

    <script>
        const ipc = require('electron').ipcRenderer

        var text = document.getElementById('text')

        var fs = require('fs')
        var tipText = document.getElementById('randomTip')

        var tipList = JSON.parse(fs.readFileSync(`${__dirname}/assets/randomTip.json`))
        tipText.innerHTML = tipList[Math.floor(Math.random() * tipList.length)]



        function checkInternet(cb) {
            require('dns').lookup('google.com', function (err) {
                if (err && err.code == "ENOTFOUND") {
                    cb(false);
                } else {
                    cb(true);
                }
            })
        }

        var urlParams = new URLSearchParams(window.location.search)
        if (urlParams.get('redirect') == null) {
            console.log('No Redirect, Will go to Sign In Page Afterwards')
            checkInternet(function (isConnected) {
                if (isConnected) {
                    text.innerText = 'Validated Internet Connection!'
                    ipc.send('checkForUpdates')
                } else {
                    text.innerText = 'This device is not connected to the Internet, please connect before continuing'
                    text.className = 'red'
                    window.addEventListener('online', () => checkInternet(function (isConnected) {
                        if (isConnected) {
                            text.innerText = 'Validated Internet Connection!'
                            ipc.send('checkForUpdates')
                        } else {
                            text.innerText = 'This device is not connected to the Internet, please connect before continuing'
                            text.className = 'red'
                            window.addEventListener('online', () => checkInternet());
                        }
                    }));
                }
            });
        } else {
            checkInternet(function (isConnected) {
                if (isConnected) {
                    text.innerText = 'Validated Internet Connection!'
                    window.location.href = urlParams.get('redirect')
                } else {
                    text.innerText = 'This device is not connected to the Internet, please connect before continuing'
                    text.className = 'red'
                    window.addEventListener('online', () => checkInternet(function (isConnected) {
                        if (isConnected) {
                            text.innerText = 'Validated Internet Connection!'
                            window.location.href = urlParams.get('redirect')
                        } else {
                            text.innerText = 'This device is not connected to the Internet, please connect before continuing'
                            text.className = 'red'
                            window.addEventListener('online', () => checkInternet());
                        }
                    }));
                }
            })
        }

        ipc.on('signInSuccess', () => {
            window.location.replace("createParty.html");
        })

        ipc.on('signInFail', () => {
            window.location.replace("signin.html");
        })

        ipc.on('checkingForUpdates', () => {
            console.log('Checking For Updates')
            text.innerText = 'Checking For Updates'
        })

        ipc.on('noUpdateAvailable', () => {
            console.log('No Update Available')
            text.innerText = 'No Updates Available'
            ipc.send('attemptAutoSignIn')
        })

        ipc.on('updateAvailable', (err, d) => {
            console.log('Update Available')
            console.log(d)
            text.innerText = 'Update Available'
        })

        ipc.on('updateDownloadProgress', (e, downloadObj) => {
            console.log(downloadObj)
            text.innerText = `Downloading Update... ${Math.floor(parseFloat(downloadObj.percent.toString().replace('%', ''))).toString()}%`
        })

        ipc.on('updateDownloadFinished', () => {
            console.log('Update Download Finished')
            text.innerText = 'Download Finished, Installing Update'
        })
    </script>
</body>

</html>
